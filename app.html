<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <title>Магазин в Telegram — демо</title>
  <meta name="description" content="Демо мини-приложения магазина одежды в Telegram: каталог, корзина, заказы и панель продавца.">
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="stage">
    <div class="app" id="app">
      <div class="demobar">
        <span class="tag">ДЕМО</span>
        <div class="seg" id="seg">
          <button data-r="client" class="on">Покупатель</button>
          <button data-r="seller">Продавец</button>
        </div>
        <button class="reset" id="resetBtn" aria-label="Сбросить демо" title="Сбросить демо">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>
        </button>
      </div>
      <main class="screen" id="screen"></main>
      <div id="bottom"></div>
      <nav class="tabbar" id="tabbar"></nav>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <div class="desk-note">Демо мини-приложения в Telegram. На телефоне откроется на весь экран.<br><a href="index.html" data-keep-for>← К презентации</a></div>
  <script src="assets/js/shop-name.js?v=2"></script>
  <script src="assets/js/products.js?v=2"></script>
  <script src="assets/js/app.js?v=2"></script>
</body>
</html>
